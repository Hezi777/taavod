name: Taavod
options:
  bundleIdPrefix: com.hezi777
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
targets:
  Taavod:
    type: application
    platform: macOS
    sources:
      - path: Taavod
        excludes: [Resources]
      - path: Taavod/Resources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hezi777.taavod
        PRODUCT_NAME: Taavod
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_CFBundleDisplayName: Taavod
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TaavodTests:
    type: bundle.unit-test
    platform: macOS
    sources: [TaavodTests]
    dependencies:
      - target: Taavod
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Taavod:
    build:
      targets:
        Taavod: all
    test:
      targets: [TaavodTests]
